name: Sync 3x‑ui Upstream
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync fork from MHSanaei/3x-ui
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: MHSanaei/3x-ui
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

      # ==========新增：同步完成后，中文README.zh_CN.md覆盖README.md，主页默认中文==========
      - name: Overwrite README.md with Chinese README.zh_CN.md
        run: |
          cp -f README.zh_CN.md README.md
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"

      - name: Commit & Push Chinese README
        run: |
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: use README.zh_CN.md as main README" && git push)
